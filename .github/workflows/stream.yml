name: DeepSeek Harness WebUI + Cloudflare Tunnel

on:
  workflow_dispatch: # اجرای دستی از تب Actions

jobs:
  run-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write # دسترسی برای ذخیره و Push کردن فایل‌ها روی گیت‌هاب

    steps:
      # ۱. دریافت کدهای مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ۲. نصب Node.js 22 (پیش‌نیاز رسمی DeepSeek Harness)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ۳. دانلود و نصب کلاینت Cloudflared
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      # ۴. تنظیم هویت Git برای کامیت خودکار
      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ۵. اجرای WebUI دیپ‌سیک، تانل کلادفلر و همگام‌سازی فایل‌ها
      - name: Start DeepSeek Harness & Cloudflare Tunnel
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "=================================================="
          echo "🚀 در حال راه‌اندازی DeepSeek Harness WebUI..."
          echo "=================================================="

          # اجرای سرویس وب روی پورت 3080 در پس‌زمینه
          npx -y @deepseek-ai/dsh web --port 3080 --no-open > harness.log 2>&1 &
          HARNESS_PID=$!

          # چند ثانیه مکث برای آماده‌سازی سرور وب
          sleep 6

          # شروع تونل کلادفلر متصل به پورت 3080
          cloudflared tunnel --url http://127.0.0.1:3080 > tunnel.log 2>&1 &
          TUNNEL_PID=$!

          # استخراج و نمایش لینک اختصاصی در لاگ
          echo "⏳ در حال ساخت لینک دسترسی کلادفلر..."
          sleep 5
          for i in {1..15}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo ""
              echo "============================================================"
              echo "🌐 لینک ورود به DeepSeek Harness WebUI:"
              echo "👉 $URL"
              echo "============================================================"
              echo ""
              break
            fi
            sleep 2
          done

          # تابع ذخیره و کامیت خودکار تغییرات روی مخزن (استفاده از گیت‌هاب به عنوان SSD)
          sync_to_repo() {
            if [ -n "$(git status --porcelain)" ]; then
              echo "📦 در حال کامیت و پوش تغییرات روی مخزن..."
              git add -A
              git commit -m "Auto-save workspace: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
              echo "✅ تغییرات با موفقیت ذخیره شدند."
            fi
          }

          # ذخیره نهایی در صورت توقف یا کنسل شدن ورک‌فلو
          trap sync_to_repo EXIT

          # چرخه فعال نگه داشتن رانر و بکاپ خودکار هر ۲ دقیقه
          echo "⚡ رانر فعال است و تغییرات هر ۲ دقیقه روی مخزن ذخیره می‌شوند..."
          while kill -0 $HARNESS_PID 2>/dev/null; do
            sleep 120
            sync_to_repo
          done
