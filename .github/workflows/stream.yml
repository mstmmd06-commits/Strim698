name: Windows Cloud RDP (100% TCP FIXED)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable RDP & FORCE TCP ONLY (THE REAL FIX)
        run: |
          Write-Host "Configuring RDP for maximum stability over Tailscale..."
          
          # 1. روشن کردن RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          
          # 2. باز کردن فایروال
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # 3. خاموش کردن NLA (برای جلوگیری از گیر کردن در احراز هویت اولیه)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          
          # 🔥 4. خط جادویی اول: اجبار سرور به استفاده فقط از TCP (غیرفعال کردن UDP در سمت هاست)
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'fDisableUDP' -Value 1 -Force
          
          # 🔥 5. خط جادویی دوم: تغییر لایه امنیتی به RDP خالص (جلوگیری از هنگ کردن TLS در شبکه‌های VPN)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 1 -Force
          
          Write-Host "✅ RDP is now strictly configured for TCP-only. Black screen issue resolved."

      - name: 2. Create Admin Account
        run: |
          Write-Host "Creating user account..."
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026
          Write-Host "✅ User account created."

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "Installing Tailscale..."
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          Write-Host "Connecting to Tailscale..."
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-stable"
          
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! (STRICT TCP MODE) <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : CynetAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : Cynet@2026" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (6 Hours)
        run: |
          Write-Host "🔄 Keeping server alive..."
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 10 -eq 0) {
              Write-Host "[$i/360] Server running..."
            }
          }
