name: Deploy DeepSeek Harness with Cloudflare Tunnel

on:
  workflow_dispatch: # با دکمه‌ی Run workflow دستی شروع میشه

env:
  NODE_VERSION: '22.19.0'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install DeepSeek Harness
        run: |
          npm install -g @deepseek-ai/dsh

      - name: Start dsh web in background
        run: |
          nohup dsh web --host 0.0.0.0 --port 3080 > dsh.log 2>&1 &
          sleep 10

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Create Cloudflare Quick Tunnel
        run: |
          ./cloudflared tunnel --url http://localhost:3080 > cloudflare.log 2>&1 &

      - name: Wait for tunnel and extract URL
        run: |
          sleep 15
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cloudflare.log | head -n 1 > tunnel_url.txt

      - name: Upload logs and URL as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-logs
          path: |
            dsh.log
            cloudflare.log
            tunnel_url.txt

      - name: Keep workflow running
        run: |
          echo "✅ Web UI is running!"
          echo "🌐 Tunnel URL: $(cat tunnel_url.txt)"
          echo "⏳ This workflow will keep running. You can stop it from the Actions tab."
          sleep 30d
