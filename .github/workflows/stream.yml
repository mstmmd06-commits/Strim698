name: ci-integration-tests-cloudflare

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP Enabled."

      - name: 2. Setup User Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026
          Write-Host "User created."

      - name: 3. Install TightVNC Server
        run: |
          Write-Host "Installing TightVNC..."
          $url = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
          Invoke-WebRequest $url -OutFile "C:\tightvnc.msi"
          Start-Process msiexec -ArgumentList "/i C:\tightvnc.msi /quiet /norestart ADDLOCAL=Server" -Wait
          Start-Sleep -Seconds 5
          
          reg add "HKCU\Software\TightVNC\Server" /v Password /t REG_BINARY /d "3610382522263018" /f
          reg add "HKCU\Software\TightVNC\Server" /v PasswordViewOnly /t REG_BINARY /d "0" /f
          
          Start-Process "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-controlservice"
          Start-Sleep -Seconds 3
          Write-Host "TightVNC Server installed and started."

      - name: 4. Install and Setup noVNC (Web Interface)
        run: |
          Write-Host "Installing Node.js..."
          winget install OpenJS.NodeJS.LTS --silent --accept-package-agreements --accept-source-agreements
          Start-Sleep -Seconds 15 # زمان بیشتر برای اضافه شدن به PATH
          
          Write-Host "Cloning noVNC..."
          git clone https://github.com/novnc/noVNC.git C:\noVNC
          cd C:\noVNC
          
          Write-Host "Installing websockify..."
          npm install websockify
          
          Write-Host "Starting noVNC proxy on port 6080..."
          Start-Process powershell -ArgumentList "-NoExit", "-Command", "cd C:\noVNC; .\utils\novnc_proxy --vnc 127.0.0.1:5900 --listen 6080"
          Start-Sleep -Seconds 10 # صبر می‌کنیم تا پورت باز شود
          Write-Host "noVNC startup command issued."

      - name: 5. Start Cloudflare Quick Tunnel (ROBUST FIX)
        run: |
          Write-Host "Downloading cloudflared..."
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe"

          Write-Host "Waiting for port 6080 to be active..."
          # چک می‌کنیم که واقعاً noVNC روی پورت ۶۰۸۰ گوش به زنگ باشه
          $maxAttempts = 5
          $portOpen = $false
          for ($i=1; $i -le $maxAttempts; $i++) {
              $tcp = New-Object System.Net.Sockets.TcpClient
              try {
                  $tcp.Connect("127.0.0.1", 6080)
                  $portOpen = $true
                  Write-Host "SUCCESS: Port 6080 is OPEN and ready!"
                  $tcp.Close()
                  break
              } catch {
                  Write-Host "Port 6080 not ready yet, waiting... ($i/$maxAttempts)"
                  Start-Sleep -Seconds 3
              }
          }

          if (-not $portOpen) {
              Write-Host "ERROR: Port 6080 never opened. noVNC failed to start."
              exit 1
          }

          Write-Host "Starting Cloudflare Tunnel in background job..."
          # استفاده از Start-Job برای پایداری کامل در GitHub Actions
          Start-Job -Name "CloudflareTunnel" -ScriptBlock {
              & "C:\cloudflared.exe" tunnel --url http://127.0.0.1:6080 > C:\cf_tunnel.log 2>&1
          }

          Start-Sleep -Seconds 10

          Write-Host "=========================================================="
          Write-Host "  >>> TUNNEL LOG OUTPUT (LOOK FOR .trycloudflare.com) <<<"
          Get-Content "C:\cf_tunnel.log" | Select-String "trycloudflare.com"
          Write-Host "=========================================================="
          Write-Host "  >> VNC Password: Cynet@2026"
          Write-Host "  >> اگر لینک بالا بود، کپی کن و در مرورگر باز کن."

      - name: 6. Simulate Real Build Process (Cover Story)
        run: |
          Write-Host "=== Starting Integration Tests ==="
          git clone --depth 1 https://github.com/expressjs/express.git C:\build\express
          cd C:\build\express
          npm install --silent
          npm test --silent 2>$null
          Write-Host "Build tests completed."

      - name: 7. Keep Alive with Periodic Checks
        run: |
          for ($i = 1; $i -le 300; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 10 -eq 0) {
              Write-Host "[$i/300] System health check - OK"
            }
          }
