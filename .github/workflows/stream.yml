name: DeepSeek Harness WebUI + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write # مجوز کامل برای خواندن و نوشتن روی مخزن

    steps:
      # ۱. دریافت کامل مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ۲. نصب Node.js نسخه 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ۳. دانلود و نصب کلاینت Cloudflared
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      # ۴. نصب رسمی پکیج DeepSeek Harness
      - name: Install DeepSeek Harness
        run: |
          echo "📦 در حال نصب رسمی پکیج DeepSeek Harness..."
          npm install -g @deepseek-ai/dsh@latest

      # ۵. آماده‌سازی پوشه‌های ذخیره‌سازی داده‌ها و تنظیم گیت
      - name: Setup Persistent Storage & Git
        run: |
          # ساخت پوشه‌های ذخیره تاریخچه، تنظیمات و چت‌های دیپ‌سیک داخل مخزن
          mkdir -p .dsh_data .deepseek_data workspace
          
          # اتصال داده‌های سیستمی دیپ‌سیک به داخل مخزن (Symlink)
          ln -sfn "$(pwd)/.dsh_data" "$HOME/.dsh"
          ln -sfn "$(pwd)/.deepseek_data" "$HOME/.deepseek"

          # تنظیم مشخصات کامیت‌کننده گیت
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ۶. راه‌اندازی WebUI، حل خطای 403، بکاپ خودکار سریع
      - name: Start DeepSeek Harness & Cloudflare Tunnel
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "=================================================="
          echo "🚀 در حال بالا آوردن DeepSeek Harness WebUI..."
          echo "=================================================="

          # اجرای وب سرور در پس‌زمینه
          dsh web --port 3080 --no-open > harness.log 2>&1 &
          HARNESS_PID=$!

          # تست سلامت پورت ۳۰۸۰
          echo "⏳ در حال انتظار برای آماده‌سازی کامل وب..."
          for i in {1..40}; do
            if curl -s http://127.0.0.1:3080 > /dev/null 2>&1; then
              echo "✅ وب‌سرور دیپ‌سیک با موفقیت آماده به کار شد!"
              break
            fi
            sleep 2
          done

          # اجرای کلادفلر با هدر بازنویسی‌شده جهت رفع کامل ارور 403
          cloudflared tunnel --url http://127.0.0.1:3080 --http-host-header "127.0.0.1:3080" > tunnel.log 2>&1 &
          TUNNEL_PID=$!

          # استخراج و نمایش لینک
          sleep 6
          for i in {1..15}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo ""
              echo "============================================================"
              echo "🌐 لینک ورود بدون مشکل 403 و با بکاپ لحظه‌ای:"
              echo "👉 $URL"
              echo "============================================================"
              echo ""
              break
            fi
            sleep 2
          done

          # تابع هوشمند ذخیره تک‌تک جزئیات و فایل‌ها روی مخزن
          sync_to_repo() {
            if [ -n "$(git status --porcelain)" ]; then
              echo "📦 تغییرات جدید شناسایی شد؛ در حال ذخیره و Push روی مخزن..."
              git add -A
              git commit -m "Auto-save all workspace and session data: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
              echo "✅ تمام فایل‌ها و سشن‌ها با موفقیت ذخیره شدند."
            fi
          }

          # ذخیره لحظه خروج یا متوقف شدن ورک‌فلو
          trap sync_to_repo EXIT SIGINT SIGTERM

          # پایش مستمر و ذخیره‌سازی هر ۳۰ ثانیه یک‌بار
          echo "⚡ رانر فعال است و هر ۳۰ ثانیه تمام اطلاعات روی مخزن همگام می‌شوند..."
          while kill -0 $HARNESS_PID 2>/dev/null; do
            sleep 30
            sync_to_repo
          done
