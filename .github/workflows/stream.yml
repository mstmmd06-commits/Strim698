name: Hermes Desktop Direct

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install Desktop Environment + Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb \
            openbox \
            x11vnc \
            novnc \
            websockify \
            curl \
            git \
            nodejs \
            npm \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libgbm1 \
            libasound2 \
            libxshmfence1 \
            xdg-utils
        shell: bash

      - name: 2. Install Hermes Agent + Desktop
        run: |
          echo "🔥 Installing Hermes Agent..."
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          
          echo "✅ Hermes installed!"
          export PATH="$HOME/.local/bin:$PATH"
          hermes --version
        shell: bash

      - name: 3. Start Virtual Display (Xvfb)
        run: |
          # Start Xvfb with 1920x1080 resolution
          nohup Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          
          # Configure Openbox to auto-start Hermes Desktop fullscreen
          mkdir -p ~/.config/openbox
          cat > ~/.config/openbox/autostart << 'EOF'
# Remove window decorations, make Hermes Desktop fullscreen
# Auto-start Hermes Desktop
(sleep 2 && hermes desktop --fullscreen 2>/dev/null || hermes desktop) &
EOF
          
          cat > ~/.config/openbox/rc.xml << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<openbox_config>
  <applications>
    <application name="*">
      <decor>no</decor>
      <fullscreen>yes</fullscreen>
      <maximized>yes</maximized>
    </application>
  </applications>
</openbox_config>
EOF
          
          echo "✅ Openbox configured for fullscreen Hermes Desktop"
        shell: bash

      - name: 4. Start Window Manager + Hermes Desktop
        env:
          DISPLAY: :99
        run: |
          # Start openbox (minimal window manager)
          nohup openbox-session > /tmp/openbox.log 2>&1 &
          sleep 5
          
          echo "✅ Openbox started"
          echo "✅ Hermes Desktop should be launching..."
        shell: bash

      - name: 5. Start VNC + noVNC
        env:
          DISPLAY: :99
        run: |
          echo "Starting VNC server..."
          nohup x11vnc -display :99 -forever -shared -nopw > /tmp/vnc.log 2>&1 &
          sleep 3
          
          echo "Starting noVNC web interface..."
          nohup websockify --web /usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 5
          
          # Verify ports are listening
          if ss -tlnp | grep -q ":6080"; then
            echo "✅ noVNC is ready on port 6080"
          else
            echo "❌ noVNC failed to start"
            cat /tmp/novnc.log
            exit 1
          fi
        shell: bash

      - name: 6. Start Cloudflare Tunnel
        run: |
          echo "Downloading cloudflared..."
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          
          echo "Starting Cloudflare Tunnel..."
          nohup ./cloudflared tunnel --no-autoupdate --url http://localhost:6080 > /tmp/cf.log 2>&1 &
          
          # Wait for URL
          echo "⏳ Waiting for tunnel URL..."
          for i in $(seq 1 30); do
            sleep 2
            url=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/cf.log | head -1)
            if [ -n "$url" ]; then
              break
            fi
            echo "Attempt $i/30..."
          done
          
          if [ -z "$url" ]; then
            echo "❌ Failed to get tunnel URL"
            cat /tmp/cf.log
            exit 1
          fi
          
          sleep 5
          
          echo ""
          echo "=================================================="
          echo "  >>> HERMES DESKTOP IS READY! <<<"
          echo ""
          echo "  🔗 URL: $url/vnc.html?autoconnect=true"
          echo ""
          echo "  📱 Open this URL in your phone browser!"
          echo "  🖥️ You will see ONLY Hermes Desktop (fullscreen)"
          echo "  🚫 No desktop, no other apps - just Hermes!"
          echo "=================================================="
          echo ""
          
          echo "$url" > /tmp/tunnel_url.txt
        shell: bash

      - name: 7. Keep Alive (6 Hours)
        run: |
          url=$(cat /tmp/tunnel_url.txt)
          echo ""
          echo "=================================================="
          echo "  🚀 Hermes Desktop is running!"
          echo "  🔗 URL: $url/vnc.html?autoconnect=true"
          echo "=================================================="
          echo ""
          
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360] Hermes Desktop running..."
            
            if [ $((i % 30)) -eq 0 ]; then
              echo "--- Health Check ---"
              echo "Xvfb: $(pgrep -c Xvfb) process(es)"
              echo "Openbox: $(pgrep -c openbox) process(es)"
              echo "VNC: $(ss -tlnp | grep -c :5900) listener(s)"
              echo "noVNC: $(ss -tlnp | grep -c :6080) listener(s)"
            fi
          done
        shell: bash
