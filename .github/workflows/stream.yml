name: DeepSeek Harness WebUI + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      - name: Install DeepSeek Harness
        run: npm install -g @deepseek-ai/dsh@latest

      - name: Setup Storage and Git
        run: |
          mkdir -p .dsh_data .deepseek_data workspace
          ln -sfn "$(pwd)/.dsh_data" "$HOME/.dsh"
          ln -sfn "$(pwd)/.deepseek_data" "$HOME/.deepseek"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Plugin Market
        run: dsh plugin --profile web add dshmarket

      - name: Fix BOM in profile files
        run: |
          echo "Cleaning BOM from profile files..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            const profileDir = path.join(process.env.HOME, '.dsh/profiles/web');
            
            function cleanBOM(filePath) {
              if (fs.existsSync(filePath)) {
                let content = fs.readFileSync(filePath, 'utf8');
                if (content.charCodeAt(0) === 0xFEFF) {
                  content = content.slice(1);
                  fs.writeFileSync(filePath, content, 'utf8');
                  console.log('BOM removed from:', filePath);
                }
              }
            }
            
            cleanBOM(path.join(profileDir, 'package.json'));
            cleanBOM(path.join(profileDir, 'cordis.patch.yml'));
          "

      - name: Configure 9Router Provider
        env:
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          mkdir -p "$HOME/.dsh"
          printf 'llm-pi-ai:\n  providers:\n    nine-router:\n      apiKeyEnv: NINE_ROUTER_API_KEY\n      api: openai-completions\n      baseURL: %s\n' "$NINE_ROUTER_BASE_URL" > "$HOME/.dsh/settings.yaml"
          echo "=== settings.yaml created ==="
          cat "$HOME/.dsh/settings.yaml"

      - name: Start DeepSeek Harness and Cloudflare Tunnel
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          # Start Cloudflare tunnel
          cloudflared tunnel --url http://127.0.0.1:3080 > tunnel.log 2>&1 &
          
          # Wait for tunnel URL
          URL=""
          for i in {1..30}; do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "Tunnel URL found: $URL"
              break
            fi
            sleep 2
          done
          
          # Check if URL was found
          if [ -z "$URL" ]; then
            echo "ERROR: Failed to get Cloudflare URL"
            cat tunnel.log
            exit 1
          fi
          
          # Extract hostname for trusted-host
          HOSTNAME=$(echo "$URL" | sed 's|^https://||')
          
          # Start DeepSeek Harness web server
          dsh web --port 3080 --no-open --trusted-host "$HOSTNAME" > harness.log 2>&1 &
          HARNESS_PID=$!
          
          # Wait for web server to be ready
          for i in {1..40}; do
            if curl -s http://127.0.0.1:3080 > /dev/null 2>&1; then
              echo "Web server is ready"
              break
            fi
            sleep 2
          done
          
          # Display final URL
          echo ""
          echo "============================================================"
          echo "ACCESS URL: $URL"
          echo "============================================================"
          echo ""
          echo "INSTALLED PLUGINS:"
          echo "  - dsh-market (plugin marketplace)"
          echo ""
          echo "CONFIGURED PROVIDER:"
          echo "  - nine-router (9Router gateway)"
          echo ""
          echo "AFTER LOGIN:"
          echo "1. Go to Settings -> Models"
          echo "2. Click on 'nine-router'"
          echo "3. Click 'Fetch available models'"
          echo "4. Models from 9Router will be listed automatically"
          echo ""
          
          # Auto backup function
          sync_to_repo() {
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Auto-save: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
            fi
          }
          
          # Save on exit
          trap sync_to_repo EXIT SIGINT SIGTERM
          
          # Continuous backup every 30 seconds
          while kill -0 $HARNESS_PID 2>/dev/null; do
            sleep 30
            sync_to_repo
          done
