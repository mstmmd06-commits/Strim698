name: OpenCode Desktop Kiosk + Cloudflare

on:
  workflow_dispatch:

jobs:
  run-opencode-desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb
          cloudflared --version

      - name: Install Kiosk Dependencies (Minimal - No XFCE!)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            openbox \
            x11vnc \
            websockify \
            novnc \
            wget \
            curl \
            ca-certificates \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            libxcb-dri3-0 \
            libsecret-1-0 \
            libappindicator3-1 \
            libu2f-udev \
            fonts-liberation \
            fonts-noto-color-emoji
          
          echo "✅ Minimal Kiosk environment installed"

      - name: Download OpenCode Desktop (Latest v1.18.21)
        run: |
          mkdir -p /opt/opencode
          cd /opt/opencode
          
          # دانلود نسخه دسکتاپ واقعی اوپن‌کد
          wget -O opencode-desktop.AppImage \
            "https://github.com/anomalyco/opencode/releases/download/v1.18.21/opencode-desktop-linux-x86_64.AppImage"
          
          chmod +x opencode-desktop.AppImage
          ls -lh opencode-desktop.AppImage
          echo "✅ OpenCode Desktop downloaded"

      - name: Setup Workspace & Config
        env:
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          mkdir -p opencode_workspace
          cd opencode_workspace
          
          echo "# My OpenCode Project" > README.md
          echo '{"name": "opencode-project", "version": "1.0.0"}' > package.json
          
          cat > opencode.json << CFG_EOF
          {
            "provider": {
              "name": "nine-router",
              "apiKey": "$NINE_ROUTER_API_KEY",
              "baseURL": "$NINE_ROUTER_BASE_URL",
              "model": "deepseek-chat"
            },
            "mcp": {},
            "agents": {
              "general": {
                "model": "deepseek-chat"
              }
            }
          }
          CFG_EOF
          
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initial project setup" || true
          
          echo "=== Workspace Ready ==="
          pwd
          ls -la

      - name: Start Xvfb (Virtual Display)
        run: |
          # نمایشگر مجازی فول‌اچ‌دی
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          echo "XVFB_PID=$XVFB_PID" >> $GITHUB_ENV
          export DISPLAY=:99
          sleep 2
          
          if ps -p $XVFB_PID > /dev/null; then
            echo "✅ Xvfb started on :99 (1920x1080)"
          else
            echo "❌ Xvfb failed"
            cat /tmp/xvfb.log
            exit 1
          fi

      - name: Start Openbox (Minimal Window Manager - NO XFCE!)
        run: |
          export DISPLAY=:99
          openbox --sm-disable > /tmp/openbox.log 2>&1 &
          OPENBOX_PID=$!
          echo "OPENBOX_PID=$OPENBOX_PID" >> $GITHUB_ENV
          sleep 2
          echo "✅ Openbox started (Kiosk Mode - Ultra Lightweight)"

      - name: Start OpenCode Desktop App
        run: |
          export DISPLAY=:99
          cd opencode_workspace
          
          # اجرای مستقیم اوپن‌کد دسکتاپ
          /opt/opencode/opencode-desktop.AppImage \
            --no-sandbox \
            --disable-gpu \
            --disable-software-rasterizer \
            --disable-dev-shm-usage \
            --window-size=1920,1080 \
            --start-maximized \
            > /tmp/opencode-desktop.log 2>&1 &
          
          OPENCODE_PID=$!
          echo "OPENCODE_PID=$OPENCODE_PID" >> $GITHUB_ENV
          sleep 8
          
          if ps -p $OPENCODE_PID > /dev/null; then
            echo "✅ OpenCode Desktop launched (PID: $OPENCODE_PID)"
          else
            echo "⚠️ OpenCode may have crashed, check logs"
          fi

      - name: Start VNC Server (TCP Only)
        run: |
          export DISPLAY=:99
          
          # VNC سرور روی پورت 5900 (فقط TCP - با Cloudflare سازگار)
          x11vnc -display :99 -forever -nopw -shared -rfbport 5900 \
            -ncache 10 -ncache_cr -xkb > /tmp/x11vnc.log 2>&1 &
          
          VNC_PID=$!
          echo "VNC_PID=$VNC_PID" >> $GITHUB_ENV
          sleep 3
          
          echo "✅ VNC server ready on port 5900 (TCP)"

      - name: Start noVNC Web Interface
        run: |
          # noVNC روی پورت 4096 - Cloudflare این پورت رو forward می‌کنه
          websockify --web=/usr/share/novnc/ 4096 localhost:5900 \
            > /tmp/websockify.log 2>&1 &
          
          WEBSOCKIFY_PID=$!
          echo "WEBSOCKIFY_PID=$WEBSOCKIFY_PID" >> $GITHUB_ENV
          sleep 5
          
          # بررسی آماده بودن noVNC
          if curl -s http://127.0.0.1:4096 > /dev/null 2>&1; then
            echo "✅ noVNC ready on port 4096"
          else
            echo "❌ noVNC failed"
            cat /tmp/websockify.log
            exit 1
          fi

      - name: Start Cloudflare Quick Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:4096 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
          
          URL=""
          for i in {1..30}; do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -z "$URL" ]; then
            echo "❌ Cloudflare Tunnel failed"
            cat tunnel.log
            exit 1
          fi
          
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
          echo "✅ Tunnel URL: $URL"

      - name: Display Access Info & Keep Alive
        run: |
          echo ""
          echo "=========================================="
          echo "🎯 OpenCode Desktop Kiosk is LIVE!"
          echo "=========================================="
          echo ""
          echo "🖥️  ACCESS YOUR DESKTOP APP:"
          echo "   ${TUNNEL_URL}/vnc.html?autoconnect=true&resize=scale"
          echo ""
          echo "🔧 FEATURES:"
          echo "   ✅ Real OpenCode Desktop App (Electron v1.18.21)"
          echo "   ✅ Kiosk Mode (Openbox - NO XFCE bloat!)"
          echo "   ✅ Ultra Lightweight (~200-400 MB RAM)"
          echo "   ✅ Full mouse & keyboard support"
          echo "   ✅ Auto-resize to browser window"
          echo "   ✅ Cloudflare Tunnel (No UDP needed!)"
          echo ""
          echo "📱 ACCESS FROM PHONE:"
          echo "   Just open the URL above in any mobile browser!"
          echo ""
          echo "📂 WORKSPACE:"
          echo "   /home/runner/work/Strim698/Strim698/opencode_workspace"
          echo ""
          echo "⏰ Session Duration:"
          echo "   GitHub Actions: max 6 hours"
          echo "   Auto-save to repo: every 30 seconds"
          echo ""
          echo "=========================================="
          echo ""
          
          # تابع سینک خودکار
          sync_to_repo() {
            cd "$GITHUB_WORKSPACE/opencode_workspace"
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Auto-save: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
            fi
          }
          
          trap sync_to_repo EXIT SIGINT SIGTERM
          
          # زنده نگه داشتن ورک‌فلو + چک کردن پروسه‌ها
          while true; do
            sleep 30
            
            # بررسی همه پروسه‌ها
            ALL_OK=true
            for pid_var in XVFB_PID OPENBOX_PID VNC_PID WEBSOCKIFY_PID TUNNEL_PID; do
              pid=${!pid_var}
              if [ -n "$pid" ] && ! kill -0 $pid 2>/dev/null; then
                echo "⚠️ Process $pid_var ($pid) died!"
                ALL_OK=false
              fi
            done
            
            if [ "$ALL_OK" = false ]; then
              echo "Critical process died, exiting..."
              break
            fi
            
            sync_to_repo
            
            # لاگ مختصر
            MEM=$(free -m | awk 'NR==2{printf "%.1f%%", $3*100/$2 }')
            echo "[$(date '+%H:%M:%S')] All processes running - Memory: $MEM"
          done

      - name: Final Sync & Cleanup
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/opencode_workspace"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Final sync: $(date '+%Y-%m-%d %H:%M:%S')" || true
            git push origin HEAD || true
          fi
          
          # کشتن همه پروسه‌ها
          kill $XVFB_PID $OPENBOX_PID $VNC_PID $WEBSOCKIFY_PID $TUNNEL_PID 2>/dev/null || true
          
          echo "✅ Cleanup complete"
