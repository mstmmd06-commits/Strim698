name: DeepSeek Harness WebUI + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ۱. دریافت کدهای مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ۲. نصب Node.js نسخه 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ۳. دانلود و نصب کلاینت Cloudflared
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      # ۴. نصب رسمی پکیج DeepSeek Harness
      - name: Install DeepSeek Harness
        run: |
          echo "📦 در حال دانلود و نصب کامل پکیج DeepSeek Harness..."
          npm install -g @deepseek-ai/dsh@latest

      # ۵. تنظیم هویت Git برای کامیت خودکار
      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ۶. اجرای وب و تونل و تست سلامت
      - name: Start DeepSeek Harness & Cloudflare Tunnel
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "=================================================="
          echo "🚀 در حال اجرای DeepSeek Harness WebUI..."
          echo "=================================================="

          # اجرای سرور در پس‌زمینه
          dsh web --port 3080 --no-open > harness.log 2>&1 &
          HARNESS_PID=$!

          # بررسی مداوم تا زمان فعال شدن پورت 3080
          echo "⏳ در حال انتظار برای آماده‌سازی کامل سرور وب..."
          for i in {1..40}; do
            if curl -s http://127.0.0.1:3080 > /dev/null 2>&1; then
              echo "✅ سرور دیپ‌سیک روی پورت 3080 با موفقیت آماده شد!"
              break
            fi
            sleep 3
          done

          # اجرای تونل کلادفلر
          cloudflared tunnel --url http://127.0.0.1:3080 > tunnel.log 2>&1 &
          TUNNEL_PID=$!

          # استخراج و نمایش لینک عمومی در لاگ
          sleep 5
          for i in {1..15}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo ""
              echo "============================================================"
              echo "🌐 لینک ورود به DeepSeek Harness WebUI آماده است:"
              echo "👉 $URL"
              echo "============================================================"
              echo ""
              break
            fi
            sleep 2
          done

          # تابع ذخیره و کامیت خودکار تغییرات روی مخزن
          sync_to_repo() {
            if [ -n "$(git status --porcelain)" ]; then
              echo "📦 در حال کامیت و پوش تغییرات روی مخزن..."
              git add -A
              git commit -m "Auto-save workspace: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
              echo "✅ تغییرات با موفقیت ذخیره شدند."
            fi
          }

          trap sync_to_repo EXIT

          # حلقه زنده نگه داشتن رانر و بکاپ منظم
          echo "⚡ رانر فعال است..."
          while kill -0 $HARNESS_PID 2>/dev/null; do
            sleep 120
            sync_to_repo
          done
