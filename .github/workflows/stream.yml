name: Windows Web RDP (Browser Based)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Create Admin Account
        run: |
          Write-Host "Creating user account..."
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          Write-Host "✅ User created successfully."

      - name: 2. Install Myrtille (Web-based RDP)
        run: |
          Write-Host "Installing Myrtille via Chocolatey..."
          # گیت‌هاب چاکلیتی را از قبل دارد. Myrtille یک Web RDP سبک برای ویندوز است
          choco install myrtille -y --no-progress
          
          Write-Host "Waiting for Myrtille service to start..."
          Start-Sleep -Seconds 15
          
          # بررسی وضعیت سرویس
          $service = Get-Service -Name "Myrtille" -ErrorAction SilentlyContinue
          if ($service) {
            Write-Host "✅ Myrtille Service is running on Port 80"
          } else {
            Write-Host "⚠️ Myrtille service not found, trying to start manually..."
            Start-Process "C:\Program Files (x86)\Myrtille\Myrtille.Services.exe"
            Start-Sleep -Seconds 10
          }

      - name: 3. Start Cloudflare Tunnel to Web RDP
        run: |
          Write-Host "Downloading cloudflared..."
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe"
          
          Write-Host "Starting Cloudflare Quick Tunnel to Port 80 (Myrtille)..."
          # پورت 80 برای HTTP عالی است و کلاودفلر آن را بلاک نمی‌کند
          Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList "tunnel", "--url", "http://localhost:80" -RedirectStandardOutput "C:\cf_tunnel.log"
          
          Write-Host "⏳ Waiting 15 seconds for Cloudflare to generate the URL..."
          Start-Sleep -Seconds 15
          
          Write-Host "=========================================================="
          Write-Host "  >>> FULL CLOUDFLARE LOG <<<"
          Get-Content "C:\cf_tunnel.log"
          Write-Host "=========================================================="
          
          # استخراج لینک
          $logContent = Get-Content "C:\cf_tunnel.log" -Raw
          if ($logContent -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
            $tunnelUrl = $matches[0]
            Write-Host ""
            Write-Host "==========================================================" -ForegroundColor Green
            Write-Host "  🎉 SUCCESS! YOUR WEB DESKTOP IS READY!" -ForegroundColor Cyan
            Write-Host "  🔗 YOUR BROWSER LINK: $tunnelUrl" -ForegroundColor Yellow
            Write-Host "  👤 Username: CynetAdmin" -ForegroundColor Yellow
            Write-Host "  🔑 Password: Cynet@2026" -ForegroundColor Yellow
            Write-Host "==========================================================" -ForegroundColor Green
            Write-Host "  📌 Instructions:"
            Write-Host "  1. Copy the link above and open it in your browser."
            Write-Host "  2. If you see a security warning, click 'Advanced' -> 'Proceed to ... (unsafe)'."
            Write-Host "  3. A web page will load. Click 'Connect'."
            Write-Host "  4. Enter Username: CynetAdmin and Password: Cynet@2026"
            Write-Host "  5. Enjoy your Windows Desktop in the browser!"
            Write-Host "=========================================================="
          } else {
            Write-Host "❌ Failed to extract URL. Check the log above."
          }

      - name: 4. Keep Server Alive (6 Hours)
        run: |
          Write-Host "🔄 Keeping server alive..."
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 10 -eq 0) {
              Write-Host "[$i/360] Server running..."
            }
          }
