name: DeepSeek Harness WebUI + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ۱. دریافت کامل مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ۲. نصب Node.js نسخه 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ۳. فعال‌سازی pnpm (ضروری برای نصب پلاگین‌ها)
      - name: Enable pnpm
        run: |
          echo "🔧 در حال فعال‌سازی pnpm..."
          corepack enable
          corepack prepare pnpm@latest --activate
          echo "✅ pnpm فعال شد"

      # ۴. دانلود و نصب کلاینت Cloudflared
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      # ۵. نصب رسمی پکیج DeepSeek Harness
      - name: Install DeepSeek Harness
        run: |
          echo "📦 در حال نصب رسمی پکیج DeepSeek Harness..."
          npm install -g @deepseek-ai/dsh@latest

      # ۶. آماده‌سازی پوشه‌های ذخیره‌سازی داده‌ها و تنظیم گیت
      - name: Setup Persistent Storage & Git
        run: |
          mkdir -p .dsh_data .deepseek_data workspace
          
          ln -sfn "$(pwd)/.dsh_data" "$HOME/.dsh"
          ln -sfn "$(pwd)/.deepseek_data" "$HOME/.deepseek"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ۷. نصب پلاگین‌های واجب (بازارچه + کشف پلاگین)
      - name: Install Essential Plugins
        run: |
          echo "=================================================="
          echo "🔌 در حال نصب پلاگین‌های واجب..."
          echo "=================================================="
          
          # بازارچه پلاگین از npm (نه git)
          echo "📦 نصب dsh-market (بازارچه پلاگین)..."
          dsh plugin --profile web add dshmarket || echo "⚠️ dsh-market نصب نشد"
          
          # پلاگین‌های دیگر از npm
          echo "🔍 نصب پلاگین‌های پیشنهادی..."
          dsh plugin --profile web add dsh-web-launcher || echo "⚠️ dsh-web-launcher نصب نشد"
          
          echo "✅ نصب پلاگین‌های واجب کامل شد!"

      # ۸. راه‌اندازی WebUI با 9Router، حل خطای 403، بکاپ خودکار
      - name: Start DeepSeek Harness & Cloudflare Tunnel
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          echo "=================================================="
          echo "🚀 در حال بالا آوردن Cloudflare Tunnel..."
          echo "=================================================="

          # ابتدا کلادفلر را اجرا می‌کنیم تا URL تصادفی تولید شود
          cloudflared tunnel --url http://127.0.0.1:3080 > tunnel.log 2>&1 &
          TUNNEL_PID=$!

          # استخراج لینک تولید شده از لاگ
          echo "⏳ در حال انتظار برای دریافت لینک موقت Cloudflare..."
          URL=""
          for i in {1..30}; do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "✅ لینک کلادفلر دریافت شد: $URL"
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "❌ خطا در دریافت لینک کلادفلر. محتوای لاگ:"
            cat tunnel.log
            exit 1
          fi

          # استخراج دامنه بدون https:// برای استفاده در trusted-host
          HOSTNAME=$(echo "$URL" | sed -e 's|^https://||')

          echo "=================================================="
          echo "🚀 در حال بالا آوردن DeepSeek Harness WebUI..."
          echo "=================================================="
          echo "🔧 9Router به عنوان OpenAI-compatible provider تنظیم شد"
          echo "=================================================="

          # اجرای وب سرور با trusted-host جهت دور زدن خطای 403
          dsh web --port 3080 --no-open --trusted-host "$HOSTNAME" > harness.log 2>&1 &
          HARNESS_PID=$!

          # تست سلامت پورت ۳۰۸۰
          echo "⏳ در حال انتظار برای آماده‌سازی کامل وب..."
          for i in {1..40}; do
            if curl -s http://127.0.0.1:3080 > /dev/null 2>&1; then
              echo "✅ وب‌سرور دیپ‌سیک با موفقیت آماده به کار شد!"
              break
            fi
            sleep 2
          done

          # نمایش لینک نهایی
          echo ""
          echo "============================================================"
          echo "🌐 لینک ورود بدون مشکل 403 و با بکاپ لحظه‌ای:"
          echo "👉 $URL"
          echo "============================================================"
          echo ""
          echo "✅ پلاگین‌های نصب شده:"
          echo "   - dsh-market (بازارچه پلاگین - از npm)"
          echo "   - dsh-web-launcher (راه‌انداز سریع)"
          echo ""

          # تابع ذخیره‌سازی روی مخزن
          sync_to_repo() {
            if [ -n "$(git status --porcelain)" ]; then
              echo "📦 تغییرات جدید شناسایی شد؛ در حال ذخیره و Push روی مخزن..."
              git add -A
              git commit -m "Auto-save all workspace and session data: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
              echo "✅ تمام فایل‌ها و سشن‌ها با موفقیت ذخیره شدند."
            fi
          }

          # ذخیره لحظه خروج
          trap sync_to_repo EXIT SIGINT SIGTERM

          # پایش مستمر و ذخیره‌سازی هر ۳۰ ثانیه
          echo "⚡ رانر فعال است و هر ۳۰ ثانیه تمام اطلاعات روی مخزن همگام می‌شوند..."
          while kill -0 $HARNESS_PID 2>/dev/null; do
            sleep 30
            sync_to_repo
          done
