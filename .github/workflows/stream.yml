name: DeepSeek Harness WebUI + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      - name: Install DeepSeek Harness
        run: npm install -g @deepseek-ai/dsh@latest

      - name: Setup Storage and Git
        run: |
          mkdir -p .dsh_data .deepseek_data workspace
          ln -sfn "$(pwd)/.dsh_data" "$HOME/.dsh"
          ln -sfn "$(pwd)/.deepseek_data" "$HOME/.deepseek"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Clean profile
        run: |
          rm -rf "$HOME/.dsh/profiles/web"
          mkdir -p "$HOME/.dsh/profiles/web"

      - name: Create package.json
        run: |
          cd "$HOME/.dsh/profiles/web"
          echo '{"name":"dsh-profile-web","private":true,"dependencies":{"dshmarket":"^1.16.0"},"dsh":{"profile":{"bundles":["@deepseek-ai/dsh-base","@deepseek-ai/dsh-web-app","dshmarket"]}}}' > package.json
          cat package.json

      - name: Install dependencies
        run: |
          cd "$HOME/.dsh/profiles/web"
          pnpm install --no-frozen-lockfile

      - name: Create settings.yaml (FIXED)
        env:
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          # ساختار صحیح با کلید ریشه‌ای llm-pi-ai
          cat > "$HOME/.dsh/profiles/web/settings.yaml" << EOF
          llm-pi-ai:
            providers:
              nine-router:
                apiKeyEnv: NINE_ROUTER_API_KEY
                api: openai-completions
                baseURL: $NINE_ROUTER_BASE_URL
          EOF
          
          cp "$HOME/.dsh/profiles/web/settings.yaml" "$HOME/.dsh/settings.yaml"
          
          echo "=== settings.yaml ==="
          cat "$HOME/.dsh/settings.yaml"

      - name: Start services
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          # اجرای Cloudflare Tunnel
          cloudflared tunnel --url http://127.0.0.1:3080 > tunnel.log 2>&1 &
          
          URL=""
          for i in {1..30}; do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -z "$URL" ]; then
            echo "❌ Tunnel URL not found. Logs:"
            cat tunnel.log
            exit 1
          fi
          
          HOSTNAME=$(echo "$URL" | sed 's|^https://||')
          
          # حذف --host 0.0.0.0 که باعث کرش می‌شد. پیش‌فرض 127.0.0.1 برای تونل کاملاً کافی و امن است.
          dsh web --port 3080 --no-open --trusted-host "$HOSTNAME" > harness.log 2>&1 &
          HARNESS_PID=$!
          
          for i in {1..40}; do
            if curl -s http://127.0.0.1:3080 > /dev/null 2>&1; then
              echo "✅ Web server ready"
              break
            fi
            sleep 2
          done
          
          echo ""
          echo "🔗 URL: $URL"
          echo ""
          echo "After login:"
          echo "1. Settings -> Models"
          echo "2. Click nine-router"
          echo "3. Click Fetch available models"
          echo ""
          
          sync_to_repo() {
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Auto-save: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
            fi
          }
          
          trap sync_to_repo EXIT SIGINT SIGTERM
          
          while kill -0 $HARNESS_PID 2>/dev/null; do
            sleep 30
            sync_to_repo
          done
