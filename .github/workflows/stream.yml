name: OpenCode Desktop Kiosk + Cloudflare

on:
  workflow_dispatch:

jobs:
  run-opencode-desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      - name: Install Kiosk Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            openbox \
            x11vnc \
            websockify \
            novnc \
            wget \
            curl \
            ca-certificates \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            libxcb-dri3-0 \
            libsecret-1-0 \
            libappindicator3-1 \
            fonts-liberation \
            fonts-noto-color-emoji

      - name: Download & Install OpenCode Desktop (DEB package - Stable!)
        run: |
          mkdir -p /tmp/opencode-installer
          cd /tmp/opencode-installer
          
          # دانلود نسخه .deb (پایدارتر از AppImage - بدون نیاز به FUSE)
          wget -O opencode-desktop.deb \
            "https://github.com/anomalyco/opencode/releases/download/v1.18.21/opencode-desktop-linux-amd64.deb"
          
          ls -lh opencode-desktop.deb
          echo "📦 Installing OpenCode Desktop DEB package..."
          
          # نصب پکیج DEB
          sudo dpkg -i opencode-desktop.deb || true
          
          # رفع وابستگی‌های گم شده
          sudo apt-get install -f -y
          
          # بررسی نصب موفقیت‌آمیز
          which opencode-desktop || echo "Checking alternative names..."
          ls -la /usr/bin/ | grep -i opencode || true
          ls -la /opt/ | grep -i opencode || true
          
          # پیدا کردن مسیر دقیق باینری
          OPENCODE_BIN=$(find /usr -name "*opencode-desktop*" -type f 2>/dev/null | head -1)
          if [ -z "$OPENCODE_BIN" ]; then
            OPENCODE_BIN=$(find /opt -name "*opencode*" -type f 2>/dev/null | head -1)
          fi
          echo "OPENCODE_BIN=$OPENCODE_BIN" >> $GITHUB_ENV
          echo "✅ OpenCode Desktop installed at: $OPENCODE_BIN"

      - name: Setup Workspace & Config
        env:
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          mkdir -p opencode_workspace
          cd opencode_workspace
          
          echo "# My OpenCode Project" > README.md
          echo '{"name": "opencode-project", "version": "1.0.0"}' > package.json
          
          cat > opencode.json << CFG_EOF
          {
            "provider": {
              "name": "nine-router",
              "apiKey": "$NINE_ROUTER_API_KEY",
              "baseURL": "$NINE_ROUTER_BASE_URL",
              "model": "deepseek-chat"
            },
            "mcp": {},
            "agents": {
              "general": {
                "model": "deepseek-chat"
              }
            }
          }
          CFG_EOF
          
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initial project setup" || true

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          echo "XVFB_PID=$XVFB_PID" >> $GITHUB_ENV
          export DISPLAY=:99
          sleep 2
          if ps -p $XVFB_PID > /dev/null; then
            echo "✅ Xvfb started"
          else
            cat /tmp/xvfb.log
            exit 1
          fi

      - name: Start Openbox
        run: |
          export DISPLAY=:99
          openbox --sm-disable > /tmp/openbox.log 2>&1 &
          OPENBOX_PID=$!
          echo "OPENBOX_PID=$OPENBOX_PID" >> $GITHUB_ENV
          sleep 2
          echo "✅ Openbox started (Kiosk Mode)"

      - name: Start OpenCode Desktop & Debug
        run: |
          export DISPLAY=:99
          cd opencode_workspace
          
          # اجرای OpenCode با مسیر پیدا شده
          echo "🚀 Starting OpenCode Desktop..."
          echo "Binary path: $OPENCODE_BIN"
          
          # اجرا با nohup و ذخیره کامل لاگ
          nohup "$OPENCODE_BIN" \
            --no-sandbox \
            --disable-gpu \
            --disable-software-rasterizer \
            --disable-dev-shm-usage \
            --window-size=1920,1080 \
            --start-maximized \
            > /tmp/opencode-desktop.log 2>&1 &
          
          OPENCODE_PID=$!
          echo "OPENCODE_PID=$OPENCODE_PID" >> $GITHUB_ENV
          
          # صبر بیشتر برای استارت
          sleep 10
          
          if ps -p $OPENCODE_PID > /dev/null; then
            echo "✅ OpenCode Desktop is running! (PID: $OPENCODE_PID)"
            echo "📋 Last 10 log lines:"
            tail -10 /tmp/opencode-desktop.log || true
          else
            echo "❌ OpenCode Desktop failed to start!"
            echo "📋 Full log:"
            cat /tmp/opencode-desktop.log
            echo ""
            echo "🔍 Checking for alternative binaries..."
            find / -name "*opencode*" -type f 2>/dev/null | head -20
            exit 1
          fi

      - name: Start VNC Server
        run: |
          export DISPLAY=:99
          x11vnc -display :99 -forever -nopw -shared -rfbport 5900 \
            -ncache 10 -ncache_cr -xkb > /tmp/x11vnc.log 2>&1 &
          VNC_PID=$!
          echo "VNC_PID=$VNC_PID" >> $GITHUB_ENV
          sleep 3
          echo "✅ VNC ready on port 5900"

      - name: Start noVNC
        run: |
          websockify --web=/usr/share/novnc/ 4096 localhost:5900 \
            > /tmp/websockify.log 2>&1 &
          WEBSOCKIFY_PID=$!
          echo "WEBSOCKIFY_PID=$WEBSOCKIFY_PID" >> $GITHUB_ENV
          sleep 5
          if curl -s http://127.0.0.1:4096 > /dev/null 2>&1; then
            echo "✅ noVNC ready on port 4096"
          else
            cat /tmp/websockify.log
            exit 1
          fi

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:4096 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
          
          URL=""
          for i in {1..30}; do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -z "$URL" ]; then
            cat tunnel.log
            exit 1
          fi
          
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
          echo "✅ Tunnel: $URL"

      - name: Access Info & Keep Alive
        run: |
          echo ""
          echo "=========================================="
          echo "🎯 OpenCode Desktop Kiosk LIVE!"
          echo "=========================================="
          echo ""
          echo "🖥️  ACCESS URL:"
          echo "   ${TUNNEL_URL}/vnc.html?autoconnect=true&resize=scale"
          echo ""
          echo "⚡ Features:"
          echo "   ✅ OpenCode Desktop DEB (Stable!)"
          echo "   ✅ Kiosk Mode (No XFCE)"
          echo "   ✅ ~300-400 MB RAM"
          echo "   ✅ Cloudflare TCP (No UDP)"
          echo ""
          echo "=========================================="
          echo ""
          
          sync_to_repo() {
            cd "$GITHUB_WORKSPACE/opencode_workspace"
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Auto-save: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
            fi
          }
          
          trap sync_to_repo EXIT
          
          # نمایش لاگ اولیه
          echo "📋 OpenCode initial log:"
          tail -20 /tmp/opencode-desktop.log || true
          echo ""
          
          while true; do
            sleep 30
            
            if ! ps -p $OPENCODE_PID > /dev/null 2>/dev/null; then
              echo "❌ OpenCode died! Last logs:"
              tail -30 /tmp/opencode-desktop.log
              break
            fi
            
            sync_to_repo
            MEM=$(free -m | awk 'NR==2{printf "%.1f%%", $3*100/$2 }')
            echo "[$(date '+%H:%M:%S')] Running - Mem: $MEM"
          done

      - name: Cleanup
        if: always()
        run: |
          kill $XVFB_PID $OPENBOX_PID $VNC_PID $WEBSOCKIFY_PID $TUNNEL_PID 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/opencode_workspace"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Final sync" || true
            git push origin HEAD || true
          fi
