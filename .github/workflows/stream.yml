name: OpenCode WebUI + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai@latest
          opencode --version

      - name: Setup Workspace & Config
        env:
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # ساخت پوشه پروژه در ریشه ریپازیتوری اصلی (بدون git init اضافه)
          mkdir -p opencode_workspace
          
          cat > opencode_workspace/opencode.json << EOF
          {
            "provider": {
              "name": "nine-router",
              "apiKey": "$NINE_ROUTER_API_KEY",
              "baseURL": "$NINE_ROUTER_BASE_URL",
              "model": "deepseek-v3"
            },
            "mcp": {},
            "agents": {
              "general": {
                "model": "deepseek-v3"
              }
            }
          }
          EOF
          
          echo "=== OpenCode Config Created ==="
          cat opencode_workspace/opencode.json

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:4096 > tunnel.log 2>&1 &
          
          URL=""
          for i in {1..30}; do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -z "$URL" ]; then
            echo "❌ Tunnel URL not found. Logs:"
            cat tunnel.log
            exit 1
          fi
          
          echo "✅ Tunnel URL: $URL"
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV

      - name: Start OpenCode WebUI
        env:
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # رفتن به پوشه ورک‌اسپیس برای اجرای سرور
          cd opencode_workspace
          
          # اجرای OpenCode WebUI در پس‌زمینه
          opencode web --port 4096 --host 127.0.0.1 > ../opencode.log 2>&1 &
          OPENCODE_PID=$!
          
          echo "✅ OpenCode PID: $OPENCODE_PID"
          
          # انتظار برای آماده شدن سرور
          for i in {1..40}; do
            if curl -s http://127.0.0.1:4096 > /dev/null 2>&1; then
              echo "✅ OpenCode WebUI is ready"
              break
            fi
            sleep 2
          done
          
          # تابع sync با استفاده از مسیر مطلق برای جلوگیری از خطای cd
          sync_to_repo() {
            # بازگشت به ریشه اصلی ریپازیتوری که گیت در آن تنظیم شده است
            cd "$GITHUB_WORKSPACE"
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Auto-save: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
            fi
          }
          
          # ثبت تابع برای اجرای خودکار هنگام توقف
          trap sync_to_repo EXIT SIGINT SIGTERM
          
          echo ""
          echo "=========================================="
          echo "🔗 OpenCode WebUI URL: $TUNNEL_URL"
          echo "=========================================="
          echo ""
          echo "📝 راهنما:"
          echo "1. روی لینک بالا کلیک کن"
          echo "2. فایل‌ها در پوشه 'opencode_workspace' ذخیره می‌شوند"
          echo "3. هر 30 ثانیه به‌صورت خودکار به گیت‌هاب Push می‌شوند"
          echo ""
          
          # حلقه اصلی برای زنده نگه داشتن ورک‌فلو
          while kill -0 $OPENCODE_PID 2>/dev/null; do
            sleep 30
            sync_to_repo
          done

      - name: Final Sync
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Final sync: $(date '+%Y-%m-%d %H:%M:%S')" || true
            git push origin HEAD || true
          fi
