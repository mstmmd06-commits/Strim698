name: OpenCode WebUI + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai@latest
          opencode --version

      - name: Setup Workspace & Initialize Project
        env:
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          mkdir -p opencode_workspace
          cd opencode_workspace
          echo "# My OpenCode Project" > README.md
          echo '{"name": "opencode-project", "version": "1.0.0"}' > package.json
          cat > AGENTS.md << 'AGENTS_EOF'
          # Project: My OpenCode Project

          ## Overview
          This is a coding project managed by OpenCode AI Agent.

          ## Guidelines
          - Use modern coding practices
          - Keep code clean and well-documented
          AGENTS_EOF
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initial project setup with AGENTS.md"
          cat > opencode.json << CFG_EOF
          {
            "provider": {
              "name": "nine-router",
              "apiKey": "$NINE_ROUTER_API_KEY",
              "baseURL": "$NINE_ROUTER_BASE_URL",
              "model": "deepseek-chat"
            },
            "mcp": {},
            "agents": {
              "general": {
                "model": "deepseek-chat"
              }
            }
          }
          CFG_EOF
          echo "=== Project Initialized ==="
          pwd
          ls -la

      - name: Pre-register Project (Guaranteed Fix)
        env:
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          cd opencode_workspace
          echo "=== Running opencode run to pre-register project in database ==="
          echo "This guarantees the project appears in WebUI sidebar"
          opencode run "Say hello" --format json 2>&1 | head -50 || true
          echo "=== Pre-registration complete ==="
          ls -la ~/.local/share/opencode/ || true

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:4096 > tunnel.log 2>&1 &
          URL=""
          for i in {1..30}; do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Tunnel URL not found"
            cat tunnel.log
            exit 1
          fi
          echo "Tunnel URL: $URL"
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV

      - name: Start OpenCode WebUI
        env:
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          cd opencode_workspace
          PROJECT_PATH=$(pwd)
          echo "Project path: $PROJECT_PATH"
          opencode web --port 4096 --hostname 127.0.0.1 > ../opencode.log 2>&1 &
          OPENCODE_PID=$!
          echo "OpenCode PID: $OPENCODE_PID"
          SERVER_READY=false
          for i in {1..40}; do
            if curl -s http://127.0.0.1:4096 > /dev/null 2>&1; then
              echo "OpenCode WebUI is ready"
              SERVER_READY=true
              break
            fi
            sleep 2
          done
          if [ "$SERVER_READY" = false ]; then
            echo "OpenCode failed to start"
            cat ../opencode.log
            exit 1
          fi
          sleep 3
          echo ""
          echo "=== Verifying project registration via API ==="
          curl -s http://127.0.0.1:4096/api/project | head -200 || true
          echo ""
          
          sync_to_repo() {
            cd "$GITHUB_WORKSPACE"
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Auto-save: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
            fi
          }
          
          trap sync_to_repo EXIT SIGINT SIGTERM
          echo ""
          echo "=========================================="
          echo "OpenCode WebUI URL: $TUNNEL_URL"
          echo "=========================================="
          echo ""
          echo "The project SHOULD now appear in the sidebar!"
          echo "Just open the URL and you will see 'opencode-project' in the list."
          echo ""
          
          while kill -0 $OPENCODE_PID 2>/dev/null; do
            sleep 30
            sync_to_repo
          done

      - name: Final Sync
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Final sync: $(date '+%Y-%m-%d %H:%M:%S')" || true
            git push origin HEAD || true
          fi
