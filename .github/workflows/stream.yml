name: Ubuntu GNOME + Tailscale VNC (FIXED)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Install Ubuntu GNOME Desktop
        run: |
          echo "Installing Ubuntu GNOME Desktop..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ubuntu-desktop \
            gnome-shell \
            gnome-session \
            gdm3 \
            x11vnc \
            xvfb \
            dbus-x11 \
            firefox \
            curl \
            wget \
            git
          echo "✅ GNOME Desktop installed."

      - name: 2. Setup Virtual Display & VNC Server
        run: |
          echo "Starting Virtual Display (Xvfb)..."
          Xvfb :99 -screen 0 1280x720x24 -ac &
          export DISPLAY=:99
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 3
          
          echo "Starting D-Bus and GNOME Session..."
          eval $(dbus-launch --sh-syntax)
          gnome-session --session=ubuntu &
          sleep 5
          
          echo "Setting VNC Password..."
          mkdir -p ~/.vnc
          x11vnc -storepasswd "Cynet@2026" ~/.vnc/passwd
          
          echo "Starting x11vnc server on port 5900..."
          x11vnc -display :99 -usepw -forever -shared -rfbport 5900 -noxdamage &
          sleep 3
          echo "✅ VNC Server running on port 5900."

      - name: 3. Install & Connect Tailscale VPN (THE FIX)
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }} # ✅ اینجا اصلاح شد: authkey (بدون خط تیره)
          version: "latest"

      - name: 4. Get Tailscale IP and Show Connection Info
        run: |
          # دریافت آی‌پی تایل‌اسکیل
          TS_IP=$(tailscale ip -4)
          
          echo ""
          echo "=========================================================="
          echo "  >>> UBUNTU GNOME RDP IS READY! <<<"
          echo "=========================================================="
          echo "  Tailscale IP : $TS_IP"
          echo "  Port         : 5900"
          echo "  Password     : Cynet@2026"
          echo "=========================================================="
          echo "  >> Open your VNC Viewer (RealVNC, TigerVNC, etc.)"
          echo "  >> Connect to: $TS_IP:5900"
          echo "=========================================================="

      - name: 5. Keep Server Alive (6 Hours)
        run: |
          echo "🔄 Keeping server alive..."
          for ((i=1; i<=360; i++)); do
            sleep 60
            if [ $((i % 10)) -eq 0 ]; then
              echo "[$i/360] Server running..."
            fi
          done
