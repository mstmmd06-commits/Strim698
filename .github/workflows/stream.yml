name: OpenCode Desktop + Neko (WebRTC)

on:
  workflow_dispatch:

jobs:
  run-neko-opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Cloudflared (Quick Tunnel)
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      - name: Build Custom Neko Image with OpenCode Desktop
        run: |
          # ساخت یک کانتینر سفارشی با اوپن‌کد دسکتاپ
          mkdir -p neko-opencode
          cd neko-opencode
          
          cat > Dockerfile << 'DOCKERFILE_EOF'
          # استفاده از ایمیج پایه‌ی مرورگر به عنوان پایه (چون همه چیز رو آماده داره)
          FROM ghcr.io/m1k1o/neko/firefox:latest
          
          USER root
          
          # نصب وابستگی‌های مورد نیاز برای اوپن‌کد دسکتاپ
          RUN apt-get update && apt-get install -y --no-install-recommends \
              wget \
              curl \
              libgtk-3-0 \
              libnotify4 \
              libnss3 \
              libxss1 \
              libxtst6 \
              xdg-utils \
              libatspi2.0-0 \
              libdrm2 \
              libgbm1 \
              libxcb-dri3-0 \
              libsecret-1-0 \
              fonts-liberation \
              && rm -rf /var/lib/apt/lists/*
          
          # دانلود اوپن‌کد دسکتاپ (نسخه لینوکس)
          RUN wget -O /tmp/opencode-desktop.AppImage \
              "https://github.com/sst/opencode/releases/download/v1.0.223/opencode-desktop-linux-x86_64.AppImage" && \
              chmod +x /tmp/opencode-desktop.AppImage && \
              mv /tmp/opencode-desktop.AppImage /usr/local/bin/opencode-desktop
          
          # اسکریپت استارت سفارشی
          RUN echo '#!/bin/bash\n\
          set -e\n\
          \n\
          # تنظیم متغیرهای محیطی برای اوپن‌کد دسکتاپ (اگه لازم باشه)\n\
          export DISPLAY=:99.0\n\
          \n\
          # استارت اوپن‌کد دسکتاپ در پس‌زمینه (بدون سندباکس چون تو کانتینر هستیم)\n\
          opencode-desktop --no-sandbox --disable-gpu --disable-software-rasterizer &\n\
          \n\
          # استارت مرورگر پیش‌فرض (برای رابط کاربری وب)\n\
          # اگه فقط اوپن‌کد رو می‌خوای، این خط رو کامنت کن یا تغییرش بده\n\
          exec /usr/bin/supervisord -c /etc/neko/supervisord.conf\n\
          ' > /usr/local/bin/start-custom.sh && \
              chmod +x /usr/local/bin/start-custom.sh
          
          CMD ["/usr/local/bin/start-custom.sh"]
          DOCKERFILE_EOF
          
          # ساخت ایمیج داکر
          docker build -t neko-opencode:latest .
          echo "✅ Custom Neko image built"
          docker images

      - name: Setup Workspace & Config
        env:
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          mkdir -p opencode_workspace
          cd opencode_workspace
          
          echo "# My OpenCode Project" > README.md
          echo '{"name": "opencode-project", "version": "1.0.0"}' > package.json
          
          cat > opencode.json << CFG_EOF
          {
            "provider": {
              "name": "nine-router",
              "apiKey": "$NINE_ROUTER_API_KEY",
              "baseURL": "$NINE_ROUTER_BASE_URL",
              "model": "deepseek-chat"
            },
            "mcp": {},
            "agents": {
              "general": {
                "model": "deepseek-chat"
              }
            }
          }
          CFG_EOF
          
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initial project setup" || true
          
          echo "=== Workspace Ready ==="

      - name: Start Neko Container with OpenCode Desktop
        run: |
          # اجرای کانتینر با اوپن‌کد دسکتاپ
          docker run -d \
            --name neko-opencode \
            --shm-size=2g \
            -p 8080:8080 \
            -p 52000-52100:52000-52100/udp \
            -v $(pwd)/opencode_workspace:/home/neko/workspace \
            -e NEKO_SCREEN='1920x1080@30' \
            -e NEKO_PASSWORD='opencode123' \
            -e NEKO_PASSWORD_ADMIN='admin123' \
            -e NEKO_EPR='52000-52100' \
            -e NEKO_ICELITE='true' \
            -e NEKO_UDPMUX='52000' \
            neko-opencode:latest
          
          # صبر برای استارت کامل
          sleep 15
          
          # بررسی لاگ‌ها برای دیباگ
          echo "=== Container Logs ==="
          docker logs neko-opencode | tail -50 || true
          echo "======================"
          
          # بررسی اینکه کانتینر زنده هست
          if docker ps | grep -q neko-opencode; then
            echo "✅ Neko container is running!"
          else
            echo "❌ Neko container failed to start"
            docker logs neko-opencode
            exit 1
          fi

      - name: Start Cloudflare Quick Tunnel
        run: |
          # تانل به پورت وب کانتینر (8080)
          cloudflared tunnel --url http://127.0.0.1:8080 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
          
          # استخراج URL تانل
          URL=""
          for i in {1..30}; do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -z "$URL" ]; then
            echo "❌ Cloudflare Tunnel failed"
            cat tunnel.log
            exit 1
          fi
          
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
          echo "✅ Tunnel URL: $URL"

      - name: Display Access Info & Keep Alive
        run: |
          echo ""
          echo "=========================================="
          echo "🎯 OpenCode Desktop on Neko (WebRTC)"
          echo "=========================================="
          echo ""
          echo "🌐 ACCESS URL:"
          echo "   ${TUNNEL_URL}"
          echo ""
          echo "🔐 LOGIN CREDENTIALS:"
          echo "   Username: admin"
          echo "   Password: admin123"
          echo ""
          echo "💻 WHAT YOU'LL SEE:"
          echo "   - OpenCode Desktop App (running automatically)"
          echo "   - Firefox Browser (for web interface)"
          echo "   - Workspace mounted at /home/neko/workspace"
          echo ""
          echo "⚡ WHY NEKO IS BETTER:"
          echo "   ✅ WebRTC streaming (faster than VNC)"
          echo "   ✅ Isolated Docker container"
          echo "   ✅ No XFCE bloat"
          echo "   ✅ Runs entirely in your browser"
          echo "   ✅ Low memory usage (~300MB)"
          echo ""
          echo "📱 ACCESS FROM YOUR PHONE:"
          echo "   Just open the URL above in any browser!"
          echo ""
          echo "=========================================="
          echo ""
          
          # تابع سینک خودکار
          sync_to_repo() {
            cd "$GITHUB_WORKSPACE/opencode_workspace"
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Auto-save: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
            fi
          }
          
          trap sync_to_repo EXIT SIGINT SIGTERM
          
          # زنده نگه داشتن ورک‌فلو + سینک خودکار هر ۳۰ ثانیه
          while docker ps | grep -q neko-opencode; do
            sleep 30
            sync_to_repo
            echo "[$(date '+%H:%M:%S')] Neko is running... Memory: $(docker stats --no-stream --format '{{.MemUsage}}' neko-opencode)"
          done

      - name: Cleanup
        if: always()
        run: |
          # کشتن تانل
          kill $TUNNEL_PID 2>/dev/null || true
          
          # توقف و حذف کانتینر
          docker stop neko-opencode || true
          docker rm neko-opencode || true
          
          # سینک نهایی
          cd "$GITHUB_WORKSPACE/opencode_workspace"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Final sync: $(date '+%Y-%m-%d %H:%M:%S')" || true
            git push origin HEAD || true
          fi
          
          echo "✅ Cleanup complete"
