name: OpenCode Desktop + Neko (WebRTC over TCP)

on:
  workflow_dispatch:

jobs:
  run-neko-opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Cloudflared (Quick Tunnel)
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      - name: Build Custom Neko Image with OpenCode Desktop
        run: |
          # ایجاد Dockerfile برای Neko + OpenCode Desktop
          mkdir -p neko-opencode
          cd neko-opencode
          
          cat > Dockerfile << 'DOCKERFILE_EOF'
          # استفاده از ایمیج پایه‌ی مرورگر Neko
          FROM ghcr.io/m1k1o/neko/firefox:latest
          
          USER root
          
          # نصب وابستگی‌های مورد نیاز برای اوپن‌کد دسکتاپ
          RUN apt-get update && apt-get install -y --no-install-recommends \
              wget \
              curl \
              libgtk-3-0 \
              libnotify4 \
              libnss3 \
              libxss1 \
              libxtst6 \
              xdg-utils \
              libatspi2.0-0 \
              libdrm2 \
              libgbm1 \
              libxcb-dri3-0 \
              libsecret-1-0 \
              fonts-liberation \
              && rm -rf /var/lib/apt/lists/*
          
          # دانلود اوپن‌کد دسکتاپ (نسخه صحیح v1.18.21)
          RUN wget -O /tmp/opencode-desktop.AppImage \
              "https://github.com/anomalyco/opencode/releases/download/v1.18.21/opencode-desktop-linux-x86_64.AppImage" && \
              chmod +x /tmp/opencode-desktop.AppImage && \
              mv /tmp/opencode-desktop.AppImage /usr/local/bin/opencode-desktop && \
              echo "✅ OpenCode Desktop installed successfully"
          
          # اسکریپت استارت سفارشی
          RUN echo '#!/bin/bash\n\
          set -e\n\
          \n\
          # تنظیم متغیرهای محیطی\n\
          export DISPLAY=:99.0\n\
          \n\
          # استارت اوپن‌کد دسکتاپ در پس‌زمینه\n\
          /usr/local/bin/opencode-desktop --no-sandbox --disable-gpu --disable-software-rasterizer --disable-dev-shm-usage &\n\
          OPENCODE_PID=$!\n\
          echo "OpenCode Desktop started with PID: $OPENCODE_PID"\n\
          \n\
          # استارت Neko\n\
          exec /usr/bin/supervisord -c /etc/neko/supervisord.conf\n\
          ' > /usr/local/bin/start-custom.sh && \
              chmod +x /usr/local/bin/start-custom.sh
          
          CMD ["/usr/local/bin/start-custom.sh"]
          DOCKERFILE_EOF
          
          # ساخت ایمیج داکر
          docker build -t neko-opencode:latest .
          echo "✅ Custom Neko image built successfully"
          docker images | grep neko-opencode

      - name: Setup Workspace & Config
        env:
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
        run: |
          mkdir -p opencode_workspace
          cd opencode_workspace
          
          echo "# My OpenCode Project" > README.md
          echo '{"name": "opencode-project", "version": "1.0.0"}' > package.json
          
          cat > opencode.json << CFG_EOF
          {
            "provider": {
              "name": "nine-router",
              "apiKey": "$NINE_ROUTER_API_KEY",
              "baseURL": "$NINE_ROUTER_BASE_URL",
              "model": "deepseek-chat"
            },
            "mcp": {},
            "agents": {
              "general": {
                "model": "deepseek-chat"
              }
            }
          }
          CFG_EOF
          
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initial project setup" || true
          
          echo "=== Workspace Ready ==="
          ls -la

      - name: Start Neko Container with OpenCode Desktop (TCPMUX Mode)
        run: |
          # اجرای کانتینر با TCPMUX (WebRTC روی TCP به جای UDP)
          # این با Cloudflare سازگاره!
          docker run -d \
            --name neko-opencode \
            --shm-size=2g \
            -p 8080:8080 \
            -p 52000-52100:52000-52100/tcp \
            -v $(pwd)/opencode_workspace:/home/neko/workspace \
            -e NEKO_SCREEN='1920x1080@30' \
            -e NEKO_PASSWORD='opencode123' \
            -e NEKO_PASSWORD_ADMIN='admin123' \
            -e NEKO_TCPMUX='true' \
            -e NEKO_EPR='52000-52100' \
            -e NEKO_ICELITE='true' \
            -e NEKO_UDPMUX='0' \
            -e NEKO_NAT1TO1='127.0.0.1' \
            neko-opencode:latest
          
          # صبر برای استارت کامل
          sleep 15
          
          # بررسی لاگ‌ها
          echo "=== Container Logs (last 30 lines) ==="
          docker logs neko-opencode 2>&1 | tail -30 || true
          echo "======================================"
          
          # بررسی اینکه کانتینر زنده هست
          if docker ps | grep -q neko-opencode; then
            echo "✅ Neko container is running!"
          else
            echo "❌ Neko container failed to start"
            docker logs neko-opencode 2>&1 | tail -50
            exit 1
          fi
          
          # بررسی پورت
          if curl -s http://127.0.0.1:8080 > /dev/null 2>&1; then
            echo "✅ Web interface is accessible"
          else
            echo "⚠️ Web interface not yet ready, waiting..."
            sleep 10
          fi

      - name: Start Cloudflare Quick Tunnel
        run: |
          # تانل به پورت وب (8080) و TCPMUX ports (52000-52100)
          # Cloudflare فقط TCP رو forward می‌کنه که با TCPMUX سازگاره!
          cloudflared tunnel --url http://127.0.0.1:8080 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
          
          # استخراج URL تانل
          URL=""
          for i in {1..30}; do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -z "$URL" ]; then
            echo "❌ Cloudflare Tunnel failed"
            cat tunnel.log
            exit 1
          fi
          
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
          echo "✅ Tunnel URL: $URL"

      - name: Display Access Info & Keep Alive
        run: |
          echo ""
          echo "=========================================="
          echo "🎯 OpenCode Desktop on Neko (WebRTC over TCP)"
          echo "=========================================="
          echo ""
          echo "🌐 ACCESS URL:"
          echo "   ${TUNNEL_URL}"
          echo ""
          echo "🔐 LOGIN CREDENTIALS:"
          echo "   Username: admin"
          echo "   Password: admin123"
          echo ""
          echo "💻 WHAT YOU'LL SEE:"
          echo "   ✅ OpenCode Desktop App (running automatically)"
          echo "   ✅ Firefox Browser (web interface)"
          echo "   ✅ Workspace mounted at /home/neko/workspace"
          echo ""
          echo "⚡ WHY THIS WORKS:"
          echo "   ✅ WebRTC over TCP (TCPMUX mode)"
          echo "   ✅ Compatible with Cloudflare Tunnel"
          echo "   ✅ No UDP port forwarding needed"
          echo "   ✅ Works behind NAT/firewalls"
          echo ""
          echo "📱 ACCESS FROM YOUR PHONE:"
          echo "   Just open the URL above in any browser!"
          echo ""
          echo "📂 WORKSPACE:"
          echo "   Your files are at /home/neko/workspace"
          echo ""
          echo "⚠️ IMPORTANT:"
          echo "   - Use Google Chrome or Firefox for best experience"
          echo "   - Disable VPN/ad-blockers that might block WebRTC"
          echo ""
          echo "=========================================="
          echo ""
          
          # تابع سینک خودکار
          sync_to_repo() {
            cd "$GITHUB_WORKSPACE/opencode_workspace"
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Auto-save: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || true
              git push origin HEAD || true
            fi
          }
          
          trap sync_to_repo EXIT SIGINT SIGTERM
          
          # زنده نگه داشتن ورک‌فلو
          while docker ps | grep -q neko-opencode; do
            sleep 30
            sync_to_repo
            echo "[$(date '+%H:%M:%S')] Neko running... Memory: $(docker stats --no-stream --format '{{.MemUsage}}' neko-opencode 2>/dev/null || echo 'N/A')"
          done

      - name: Cleanup
        if: always()
        run: |
          # کشتن تانل
          kill $TUNNEL_PID 2>/dev/null || true
          
          # توقف و حذف کانتینر
          docker stop neko-opencode 2>/dev/null || true
          docker rm neko-opencode 2>/dev/null || true
          
          # سینک نهایی
          cd "$GITHUB_WORKSPACE/opencode_workspace"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Final sync: $(date '+%Y-%m-%d %H:%M:%S')" || true
            git push origin HEAD || true
          fi
          
          echo "✅ Cleanup complete"
